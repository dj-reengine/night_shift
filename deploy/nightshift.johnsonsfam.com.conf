# ------------------------------------------------------------
# nightshift.johnsonsfam.com
# ------------------------------------------------------------


server {
  set $forward_scheme http;
  set $server         "10.0.0.140";
  set $port           8080;

  listen 80;
  listen [::]:80;

  server_name nightshift.johnsonsfam.com;

  access_log /data/logs/proxy-host-18_access.log proxy;
  error_log /data/logs/proxy-host-18_error.log warn;

  include /etc/nginx/conf.d/include/block-exploits.conf;

  client_max_body_size 128M;

  location / {
    include /etc/nginx/conf.d/include/proxy.conf;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
